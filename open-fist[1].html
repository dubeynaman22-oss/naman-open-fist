<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Open Fist - Teachable Machine</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      gap: 15px;
    }
    h1 { margin: 0; font-size: 1.8rem; }
    .subtitle { color: #94a3b8; font-size: 0.95rem; }
    .config-box {
      background: #1e293b;
      padding: 12px 18px;
      border-radius: 8px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="text"] {
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 10px;
      border-radius: 6px;
      width: 320px;
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 18px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0369a1; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #gesture-display {
      font-size: 1.5rem;
      font-weight: bold;
      margin: 10px 0;
      padding: 12px 24px;
      background: #1e293b;
      border-radius: 8px;
      text-align: center;
      max-width: 600px;
      border: 1px solid #334155;
    }
    #webcam-container {
      border: 2px solid #334155;
      border-radius: 10px;
      overflow: hidden;
      min-width: 200px;
      min-height: 200px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #label-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 280px;
      background: #1e293b;
      padding: 15px;
      border-radius: 8px;
    }
    #label-container div {
      font-family: monospace;
      font-size: 1rem;
    }
    .upload-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #94a3b8;
      background: #1e293b;
      padding: 8px 14px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>✊ Open Fist</h1>
  <div class="subtitle">Teachable Machine Image Model</div>

  <div class="config-box">
    <label for="url-in">Model URL:</label>
    <input type="text" id="url-in" value="./my_model/">
    <button type="button" onclick="setURL()">Set</button>
    <button type="button" onclick="loadCloudModel()" style="background:#059669;">Cloud Model</button>
  </div>

  <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
    <button type="button" id="start-btn" onclick="init()">▶ Start Camera</button>
    <button type="button" id="stop-btn" onclick="stop()" disabled>⏹ Stop</button>
    <button type="button" id="retry-btn" onclick="retryModel()" style="display:none; background:#d97706;">🔄 Retry Model</button>
  </div>

  <div class="upload-box">
    <span>Or test image without webcam:</span>
    <input type="file" id="image-upload" accept="image/*" onchange="predictUploadedImage(event)">
  </div>

  <div id="gesture-display">⏳ Initializing Open Fist...</div>

  <div id="webcam-container"></div>
  <div id="label-container"></div>

  <!-- Fast local vendor libraries matching model tfjs 1.3.1 and tmImage 0.8.5 -->
  <script src="./lib/tf.min.js"></script>
  <script src="./lib/teachablemachine-image.min.js"></script>

  <script type="text/javascript">
    // More API functions here:
    // https://github.com/googlecreativelab/teachablemachine-community/tree/master/libraries/image

    // The link to your model provided by Teachable Machine export panel
    let URL = "./my_model/";

    let model = null;
    let webcam = null;
    let labelContainer = null;
    let maxPredictions = 0;
    let isRunning = false;
    let animId = null;

    function setURL() {
      let val = document.getElementById("url-in").value.trim();
      if (!val.endsWith("/")) val += "/";
      URL = val;
      loadModel();
    }

    function loadCloudModel() {
      document.getElementById("url-in").value = "https://teachablemachine.withgoogle.com/models/sl4nmwSgl/";
      setURL();
    }

    function retryModel() {
      loadModel();
    }

    function resolveModelURL(base) {
      if (base.startsWith("http://") || base.startsWith("https://")) {
        return base.endsWith("/") ? base : base + "/";
      }
      try {
        const resolved = new URL(base, window.location.href).href;
        return resolved.endsWith("/") ? resolved : resolved + "/";
      } catch (e) {
        return base.endsWith("/") ? base : base + "/";
      }
    }

    // Shared model-loading function used by both page initialization and Start button
    async function loadModel() {
      const display = document.getElementById("gesture-display");
      const retryBtn = document.getElementById("retry-btn");
      if (retryBtn) retryBtn.style.display = "none";
      display.innerText = "⏳ Loading model from " + URL + "...";
      display.style.color = "#f8fafc";

      const resolvedBase = resolveModelURL(URL);
      const modelURL = resolvedBase + "model.json";
      const metadataURL = resolvedBase + "metadata.json";

      console.log("Loading model from:", modelURL, metadataURL);

      try {
        if (typeof tmImage === "undefined") {
          throw new Error("Teachable Machine library (tmImage) not loaded. Check network or scripts.");
        }

        // Load the model and metadata
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();
        const labels = model.getClassLabels();
        console.log("Model successfully loaded:", maxPredictions, "classes:", labels);

        // Verify model can execute predictions using a test canvas
        const testCanvas = document.createElement("canvas");
        testCanvas.width = 224;
        testCanvas.height = 224;
        const testPred = await model.predict(testCanvas);
        console.log("Verified prediction pipeline on test canvas:", testPred);

        display.innerText = "✅ Model Ready (" + labels.join(", ") + "). Click 'Start Camera' or upload image.";
        display.style.color = "#4ade80";

        // Report status to dev server
        try { fetch("/app-status?model=SUCCESS&classes=" + encodeURIComponent(labels.join(","))); } catch(e) {}

        // Append initial labels to DOM
        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
          const div = document.createElement("div");
          div.id = "pred-" + i;
          div.innerText = labels[i] + ": 0.00";
          labelContainer.appendChild(div);
        }

        return model;
      } catch (err) {
        console.error("Model Loading Failed:", err);
        display.innerText = "❌ Model Loading Failed: " + (err.message || err);
        display.style.color = "#f87171";
        if (retryBtn) retryBtn.style.display = "inline-block";
        try { fetch("/app-status?model=FAILED&error=" + encodeURIComponent(err.message || err)); } catch(e) {}
        throw err;
      }
    }

    // Start button handler: ensures model is loaded first, then initializes webcam
    async function init() {
      const startBtn = document.getElementById("start-btn");
      const stopBtn = document.getElementById("stop-btn");
      startBtn.disabled = true;

      // Ensure model is ready
      if (!model) {
        try {
          await loadModel();
        } catch (err) {
          startBtn.disabled = false;
          return;
        }
      }

      // Initialize Webcam
      try {
        const flip = true;
        webcam = new tmImage.Webcam(200, 200, flip);
        await webcam.setup(); // request access to webcam
        await webcam.play();
        isRunning = true;
        animId = window.requestAnimationFrame(loop);

        const container = document.getElementById("webcam-container");
        container.innerHTML = "";
        container.appendChild(webcam.canvas);

        stopBtn.disabled = false;
        document.getElementById("gesture-display").innerText = "🖐️/✊ Ready! Show hand or fist...";
        document.getElementById("gesture-display").style.color = "#f8fafc";
      } catch (camErr) {
        console.error("Webcam initialization error:", camErr);
        startBtn.disabled = false;
        const display = document.getElementById("gesture-display");
        display.innerText = "⚠️ Camera Error: " + (camErr.message || "Permission denied / No device");
        display.style.color = "#fbbf24";
      }
    }

    async function loop() {
      if (!isRunning) return;
      webcam.update(); // update the webcam frame
      await predict();
      animId = window.requestAnimationFrame(loop);
    }

    // Run prediction on webcam canvas
    async function predict() {
      if (!model || !webcam) return;
      const prediction = await model.predict(webcam.canvas);
      renderPrediction(prediction);
    }

    // Render prediction to DOM and gesture display
    function renderPrediction(prediction) {
      let topClass = "";
      let topProb = -1;

      for (let i = 0; i < maxPredictions; i++) {
        const classPrediction =
          prediction[i].className + ": " + prediction[i].probability.toFixed(2);
        const div = document.getElementById("pred-" + i);
        if (div) div.innerHTML = classPrediction;

        if (prediction[i].probability > topProb) {
          topProb = prediction[i].probability;
          topClass = prediction[i].className;
        }
      }

      const display = document.getElementById("gesture-display");
      const lower = topClass.toLowerCase();
      if ((lower.includes("fist") || lower.includes("closed") || lower.includes("rock")) && topProb > 0.45) {
        display.innerText = "✊ CLOSED FIST (" + (topProb * 100).toFixed(0) + "%)";
        display.style.color = "#38bdf8";
      } else if ((lower.includes("open") || lower.includes("hand") || lower.includes("paper")) && topProb > 0.45) {
        display.innerText = "🖐️ OPEN HAND (" + (topProb * 100).toFixed(0) + "%)";
        display.style.color = "#4ade80";
      } else if (lower.includes("scissor") && topProb > 0.45) {
        display.innerText = "✌️ SCISSORS (" + (topProb * 100).toFixed(0) + "%)";
        display.style.color = "#fbbf24";
      } else {
        display.innerText = topClass + " (" + (topProb * 100).toFixed(0) + "%)";
        display.style.color = "#f8fafc";
      }
    }

    // Predict uploaded image without webcam
    async function predictUploadedImage(event) {
      if (!event.target.files || !event.target.files[0]) return;
      if (!model) await loadModel();

      const file = event.target.files[0];
      const img = new Image();
      img.onload = async () => {
        stop();
        const container = document.getElementById("webcam-container");
        container.innerHTML = "";
        img.width = 200;
        img.height = 200;
        img.style.objectFit = "cover";
        container.appendChild(img);

        const prediction = await model.predict(img);
        renderPrediction(prediction);
      };
      img.src = window.URL.createObjectURL(file);
    }

    function stop() {
      isRunning = false;
      if (animId) cancelAnimationFrame(animId);
      if (webcam) {
        try { webcam.stop(); } catch(e) {}
      }
      document.getElementById("start-btn").disabled = false;
      document.getElementById("stop-btn").disabled = true;
    }

    // Auto-load model when DOM is ready
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", () => { loadModel().catch(() => {}); });
    } else {
      loadModel().catch(() => {});
    }
  </script>
</body>
</html>
